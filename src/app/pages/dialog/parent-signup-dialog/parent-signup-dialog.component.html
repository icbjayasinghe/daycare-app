<h2 mat-dialog-title>Welcome to TipToe</h2>
<mat-dialog-content>
  <mat-tab-group>
    <mat-tab label="Sign In As a Parent ">
      <form class="example-form">
        <mat-form-field class="example-full-width">
          <mat-label>Email</mat-label>
          <input
            type="email"
            matInput
            [formControl]="emailFormControl"
            placeholder="Ex. pat@example.com"
          />
        </mat-form-field>
        <mat-form-field class="example-full-width">
          <mat-label>Password</mat-label>
          <input
            type="password"
            matInput
            [formControl]="passwordFormControl"
            placeholder="Enter your password"
          />
        </mat-form-field>
      </form>
    </mat-tab>

    <mat-tab label="Register As a Parent">
      <form
        [formGroup]="signupForm"
        (ngSubmit)="onSubmit()"
        class="example-form"
      >
        <table class="example-full-width" cellspacing="0">
          <tr>
            <td>
              <mat-form-field class="example-full-width">
                <mat-label>First name</mat-label>
                <input
                  matInput
                  formControlName="firstName"
                  placeholder="Enter first name"
                />
                <mat-error
                  *ngIf="
                    signupForm.get('firstName')?.invalid &&
                    signupForm.get('firstName')?.touched
                  "
                >
                  First name is required and must be at least 2 characters.
                </mat-error>
              </mat-form-field>
            </td>
            <td>
              <mat-form-field class="example-full-width">
                <mat-label>Last Name</mat-label>
                <input
                  matInput
                  formControlName="lastName"
                  placeholder="Enter last name"
                />
                <mat-error
                  *ngIf="
                    signupForm.get('lastName')?.invalid &&
                    signupForm.get('lastName')?.touched
                  "
                >
                  Last name is required and must be at least 2 characters.
                </mat-error>
              </mat-form-field>
            </td>
          </tr>
        </table>

        <mat-form-field class="example-full-width">
          <mat-label>Email</mat-label>
          <input
            type="email"
            matInput
            formControlName="email"
            type="email"
            placeholder="Enter email"
          />
          <mat-error
            *ngIf="
              signupForm.get('email')?.invalid &&
              signupForm.get('email')?.touched
            "
          >
            Please enter a valid email.
          </mat-error>
        </mat-form-field>

        <p>
          <mat-form-field class="example-full-width">
            <mat-label>Address</mat-label>
            <textarea
              matInput
              formControlName="address"
              placeholder="Ex. 100 Main St"
            ></textarea>
          </mat-form-field>
          <mat-form-field class="example-full-width">
            <mat-label>Address 2</mat-label>
            <textarea
              matInput
              formControlName="address2"
              placeholder="Ex. Apt 1"
            ></textarea>
          </mat-form-field>
        </p>

        <table class="example-full-width" cellspacing="0">
          <tr>
            <td>
              <mat-form-field class="example-full-width">
                <mat-label>City</mat-label>
                <input
                  matInput
                  formControlName="city"
                  placeholder="Ex. San Francisco"
                />
              </mat-form-field>
            </td>
            <td>
              <mat-form-field class="example-full-width">
                <mat-label>State</mat-label>
                <input
                  matInput
                  formControlName="state"
                  placeholder="Ex. California"
                />
              </mat-form-field>
            </td>
            <td>
              <mat-form-field class="example-full-width">
                <mat-label>Postal Code</mat-label>
                <input
                  matInput
                  formControlName="postalCode"
                  #postalCode
                  maxlength="6"
                  placeholder="Ex. 94105"
                />
                <mat-hint align="end"
                  >{{ postalCode.value.length }} / 6</mat-hint
                >
              </mat-form-field>
            </td>
          </tr>
        </table>
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="signupForm.invalid"
        >
          Register
        </button>
      </form>
    </mat-tab>
  </mat-tab-group>
</mat-dialog-content>
<mat-dialog-actions>
  <!-- <button matButton (click)="onNoClick()">No Thanks</button> -->
  <!-- <button matButton [mat-dialog-close]="animal()" cdkFocusInitial>Ok</button> -->
</mat-dialog-actions>
