<h2 mat-dialog-title>Add fee plan</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="dialog-content">
    <label class="form-field">
      <span>Name</span>
      <input type="text" formControlName="name" required />
      <small
        *ngIf="form.controls['name'].touched && form.controls['name'].hasError('required')"
        class="field-error"
      >
        Enter a fee plan name.
      </small>
    </label>

    <label class="form-field">
      <span>Description</span>
      <textarea rows="3" formControlName="description"></textarea>
    </label>

    <label class="form-field">
      <span>Monthly fee</span>
      <input
        type="number"
        formControlName="monthlyFee"
        min="0"
        step="0.01"
        required
      />
      <small
        *ngIf="
          form.controls['monthlyFee'].touched &&
          form.controls['monthlyFee'].hasError('min')
        "
        class="field-error"
      >
        Monthly fee cannot be negative.
      </small>
    </label>

    <div class="date-fields">
      <label class="form-field">
        <span>Effective from</span>
        <input type="date" formControlName="effectiveFrom" required />
        <small
          *ngIf="
            form.controls['effectiveFrom'].touched &&
            form.controls['effectiveFrom'].hasError('required')
          "
          class="field-error"
        >
          Choose a start date.
        </small>
      </label>

      <label class="form-field">
        <span>Effective to</span>
        <input type="date" formControlName="effectiveTo" />
      </label>
    </div>

    <label class="active-field">
      <input type="checkbox" formControlName="active" />
      <span>Active</span>
    </label>

    <p *ngIf="errorMessage" class="error-message" role="alert">
      {{ errorMessage }}
    </p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" mat-button mat-dialog-close [disabled]="saving">
      Cancel
    </button>
    <button type="submit" mat-flat-button color="primary" [disabled]="saving">
      {{ saving ? "Saving..." : "Save fee plan" }}
    </button>
  </mat-dialog-actions>
</form>
