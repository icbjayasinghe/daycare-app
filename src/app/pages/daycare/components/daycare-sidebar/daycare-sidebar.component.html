<aside class="daycare-sidebar">
  <div class="sidebar-header">
    <img
      src="assets/img/skyhigh-tec-sidebar-logo.png"
      alt="SkyHigh"
      class="sidebar-logo"
    />
    <span class="sidebar-subtitle">Daycare Portal</span>
  </div>

  <nav class="sidebar-nav">
    <a
      routerLink="/pages/daycare/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="navigate.emit()"
    >
      <span class="icon">🏠</span>
      <span>Dashboard</span>
    </a>

    <a
      routerLink="/pages/daycare/waiting-list"
      routerLinkActive="active"
      (click)="navigate.emit()"
    >
      <span class="icon">🏫</span>
      <span>Wait List</span>
    </a>

    <a
      routerLink="/pages/daycare/current-students"
      routerLinkActive="active"
      (click)="navigate.emit()"
    >
      <span class="icon">👧</span>
      <span>Current Students</span>
    </a>

    <details class="nav-group">
      <summary>
        <span class="icon">💳</span>
        <span>Payment</span>
        <span class="nav-chevron" aria-hidden="true">⌄</span>
      </summary>
      <a
        class="subnav-item"
        routerLink="/pages/daycare/fee-plan"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="navigate.emit()"
      >
        Fee Plan
      </a>
      <a
        class="subnav-item"
        routerLink="/pages/daycare/funding-programs"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="navigate.emit()"
      >
        Funding Programs
      </a>
    </details>

    <details class="nav-group">
      <summary>
        <span class="icon">🧾</span>
        <span>Invoice Generation</span>
        <span class="nav-chevron" aria-hidden="true">⌄</span>
      </summary>
      <a
        class="subnav-item"
        routerLink="/pages/daycare/manual-invoice"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="navigate.emit()"
      >
        Manual Invoice
      </a>
      <a
        class="subnav-item"
        routerLink="/pages/daycare/auto-invoice"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="navigate.emit()"
      >
        Automatic Invoice
      </a>
    </details>

    <a
      routerLink="/pages/daycare/profile"
      routerLinkActive="active"
      (click)="navigate.emit()"
    >
      <span class="icon">👤</span>
      <span>Daycare Profile</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button type="button" class="logout-btn">
      <span class="icon">↪</span>
      <span>Logout</span>
    </button>
  </div>
</aside>
