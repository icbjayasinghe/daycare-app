<main class="fee-plan-page">
  <header class="page-header">
    <div>
      <p class="eyebrow">DAYCARE MANAGEMENT</p>
      <h1>Fee Plans</h1>
      <p class="page-description">
        Create and manage the fees offered by your daycare.
      </p>
    </div>
    <button
      type="button"
      class="add-fee-plan-button"
      aria-label="Add fee plan"
      (click)="openAddFeePlanDialog()"
    >
      <span aria-hidden="true">+</span>
    </button>
  </header>
</main>
