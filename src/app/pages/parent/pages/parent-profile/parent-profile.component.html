<main class="profile-page">
  <header class="page-header">
    <div>
      <p class="eyebrow">PARENT ACCOUNT</p>
      <h1>Parent profile</h1>
      <p class="page-description">
        View and update your contact and address details.
      </p>
    </div>
    <div class="header-actions" *ngIf="!loading && profile">
      <button
        *ngIf="!isEditing"
        type="button"
        class="button button-primary"
        (click)="startEditing()"
      >
        Edit profile
      </button>
      <ng-container *ngIf="isEditing">
        <button
          type="button"
          class="button button-secondary"
          [disabled]="saving"
          (click)="cancelEditing()"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="button button-primary"
          form="parent-profile-form"
          [disabled]="saving"
        >
          {{ saving ? "Saving..." : "Save changes" }}
        </button>
      </ng-container>
    </div>
  </header>

  <p class="feedback feedback-error" *ngIf="errorMessage" role="alert">
    {{ errorMessage }}
    <button
      *ngIf="!profile"
      type="button"
      class="text-button"
      (click)="loadProfile()"
    >
      Retry
    </button>
  </p>
  <p class="feedback feedback-success" *ngIf="successMessage" role="status">
    {{ successMessage }}
  </p>

  <div class="loading-state" *ngIf="loading" aria-live="polite">
    Loading parent profile...
  </div>

  <form
    *ngIf="!loading && profile"
    id="parent-profile-form"
    [formGroup]="profileForm"
    (ngSubmit)="saveProfile()"
  >
    <section class="profile-section">
      <div class="section-heading">
        <div>
          <h2>Personal details</h2>
          <p>Your parent account information</p>
        </div>
      </div>
      <div class="field-grid">
        <label class="field">
          <span>First name</span>
          <input
            formControlName="firstName"
            autocomplete="given-name"
            [readonly]="!isEditing"
          />
          <small
            *ngIf="
              isEditing && profileForm.get('firstName')?.hasError('required')
            "
          >
            First name is required.
          </small>
        </label>
        <label class="field">
          <span>Last name</span>
          <input
            formControlName="lastName"
            autocomplete="family-name"
            [readonly]="!isEditing"
          />
          <small
            *ngIf="
              isEditing && profileForm.get('lastName')?.hasError('required')
            "
          >
            Last name is required.
          </small>
        </label>
        <label class="field">
          <span>Email</span>
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            [readonly]="true"
          />
          <small
            *ngIf="isEditing && profileForm.get('email')?.hasError('email')"
          >
            Enter a valid email address.
          </small>
        </label>
        <label class="field">
          <span>Phone</span>
          <input
            type="tel"
            formControlName="phone"
            autocomplete="tel"
            [readonly]="!isEditing"
          />
        </label>
      </div>
    </section>

    <section class="profile-section" formGroupName="address">
      <div class="section-heading">
        <div>
          <h2>Address</h2>
          <p>Your contact address</p>
        </div>
      </div>
      <div class="field-grid">
        <label class="field">
          <span>Apartment</span>
          <input formControlName="apartment" [readonly]="!isEditing" />
        </label>
        <label class="field field-wide">
          <span>Street address</span>
          <input formControlName="address" [readonly]="!isEditing" />
        </label>
        <label class="field">
          <span>City</span>
          <input formControlName="city" [readonly]="!isEditing" />
        </label>
        <label class="field">
          <span>State / Province</span>
          <input formControlName="state" [readonly]="!isEditing" />
        </label>
        <label class="field">
          <span>Postal code</span>
          <input formControlName="postalCode" [readonly]="!isEditing" />
        </label>
        <label class="field">
          <span>Country</span>
          <input formControlName="country" [readonly]="!isEditing" />
        </label>
      </div>
    </section>
  </form>
</main>
