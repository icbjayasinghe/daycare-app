
<main class="admin-login-page">
  <section class="login-card" aria-labelledby="admin-login-heading">
    <p class="eyebrow">DAYCARE MANAGEMENT</p>
    <h1 id="admin-login-heading">Administrator sign in</h1>
    <p class="intro">Sign in with your administrator account to continue.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-field">
        <label for="admin-email">Email</label>
        <input
          id="admin-email"
          type="email"
          formControlName="email"
          autocomplete="username"
          placeholder="name@example.com"
          [attr.aria-invalid]="
            loginForm.get('email')?.invalid && loginForm.get('email')?.touched
          "
          [attr.aria-describedby]="
            loginForm.get('email')?.invalid && loginForm.get('email')?.touched
              ? 'admin-email-error'
              : null
          "
        />
        <p
          *ngIf="loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched"
          id="admin-email-error"
          class="field-error"
        >
          Email is required.
        </p>
        <p
          *ngIf="loginForm.get('email')?.hasError('email') && loginForm.get('email')?.touched"
          id="admin-email-error"
          class="field-error"
        >
          Enter a valid email address.
        </p>
      </div>

      <div class="form-field">
        <label for="admin-password">Password</label>
        <input
          id="admin-password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          [attr.aria-invalid]="
            loginForm.get('password')?.invalid &&
            loginForm.get('password')?.touched
          "
          [attr.aria-describedby]="
            loginForm.get('password')?.invalid &&
            loginForm.get('password')?.touched
              ? 'admin-password-error'
              : null
          "
        />
        <p
          *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched"
          id="admin-password-error"
          class="field-error"
        >
          Password is required.
        </p>
      </div>

      <p *ngIf="loginError" class="login-error" role="alert">
        {{ loginError }}
      </p>

      <button
        type="submit"
        [disabled]="loginForm.invalid || loading"
      >
        {{ loading ? "Signing in..." : "Sign in" }}
      </button>
    </form>
  </section>
</main>
